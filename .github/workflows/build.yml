name: Windows CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install gRPC & Protobuf
      run: |
        vcpkg install grpc protobuf
        vcpkg integrate install

    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVISION_ENABLE_WHISPER=ON -DVISION_ENABLE_OCR=ON -DVISION_ENABLE_AUDIO=ON

    - name: Build
      run: cmake --build build --config Release --parallel 4

    - name: Upload Daemon Artifact
      if: github.event_name == 'release' || github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: VisionDaemon-Windows
        path: build/bin/Release/vision_daemon.exe
